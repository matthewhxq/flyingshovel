<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flying Shovel — We're hiring</title>
<meta name="description" content="Flying Shovel is an indie game studio. We're hiring. Get in touch at matt@flyingshovel.pl.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110f;
    --fg: #f3ece2;
    --muted: #a89f92;
    --accent: #f2b134;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 0%, #2a211a 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; text-align: center; }
  .logo { width: 136px; height: 136px; margin-bottom: 8px; }
  h1 {
    margin: 0 0 12px;
    font-family: "Lilita One", "Arial Black", Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(2.8rem, 11vw, 5rem);
    letter-spacing: .03em;
    text-transform: uppercase;
    line-height: 1;
    transform: rotate(-3deg);
    filter:
      drop-shadow(2px 0 0 #2a1608) drop-shadow(-2px 0 0 #2a1608)
      drop-shadow(0 -2px 0 #2a1608) drop-shadow(0 2px 0 #2a1608)
      drop-shadow(0 4px 0 #8a4b0f) drop-shadow(0 7px 0 #2a1608)
      drop-shadow(0 14px 16px rgba(242, 177, 52, .3));
  }
  h1 span, h1 b {
    display: inline-block;
    background: linear-gradient(180deg, #ffffff 0%, #e9dcc3 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 b { background-image: linear-gradient(180deg, #ffe08a 0%, #f2b134 55%, #e07a12 100%); }
  h1 b { transform: translateY(-.06em) scale(1.08); margin-left: .1em; }
  .tag { margin: 0 0 40px; color: var(--muted); }
  h2 { margin: 0 0 12px; font-size: clamp(1.4rem, 4vw, 1.9rem); }
  p { margin: 0 0 28px; color: var(--muted); font-size: 1.05rem; }
  a.mail {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 999px;
    background: var(--accent);
    color: #1a1308;
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
    transition: transform .15s ease;
  }
  a.mail:hover, a.mail:focus-visible { transform: translateY(-2px); }
  footer { margin-top: 56px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 128 128" role="img" aria-label="Flying Shovel logo">
    <defs>
      <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd36b"/>
        <stop offset="1" stop-color="#e08a1e"/>
      </linearGradient>
      <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff8ea"/>
        <stop offset="1" stop-color="#cdbfa8"/>
      </linearGradient>
      <g id="w">
        <path d="M66 52C86 44 106 34 120 18C116 42 96 58 70 62Z" fill="url(#wing)"/>
        <path d="M66 62C86 57 104 52 117 42C111 62 94 72 70 71Z" fill="url(#wing)" opacity=".92"/>
        <path d="M66 72C82 70 96 68 107 62C101 78 88 86 70 82Z" fill="url(#wing)" opacity=".84"/>
        <path d="M66 82C78 81 88 80 96 76C90 88 80 94 68 90Z" fill="url(#wing)" opacity=".76"/>
      </g>
    </defs>
    <g transform="rotate(-30 64 64)">
      <use href="#w"/>
      <use href="#w" transform="matrix(-1 0 0 1 128 0)"/>
      <path d="M52 22v-7a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v7" fill="none" stroke="#b9794a" stroke-width="5" stroke-linecap="round"/>
      <rect x="61" y="20" width="6" height="52" rx="3" fill="#c98a58"/>
      <path d="M46 72h36c0 22-8 40-18 46C54 112 46 94 46 72z" fill="url(#blade)"/>
      <path d="M54 80c0 14 3 24 8 31" fill="none" stroke="#fff3c9" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
      <rect x="55" y="64" width="18" height="12" rx="4" fill="#8a5a34"/>
    </g>
  </svg>
  <h1><span>Flying</span> <b>Shovel</b></h1>
  <p class="tag">Indie game studio</p>

  <h2>We're hiring</h2>
  <p>Want to help us build games? Send us a short intro, your portfolio or CV, and tell us what you'd like to work on.</p>
  <a class="mail" href="mailto:matt@flyingshovel.pl?subject=Application">matt@flyingshovel.pl</a>

  <footer>&copy; Flying Shovel</footer>
</main>
</body>
</html>
